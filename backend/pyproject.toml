[project]
name = "annotate-api"
version = "0.2.0"
description = "API for annotate: highlight and take notes on your reading."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.40",
    "sqlalchemy>=2.0.48",
    "alembic>=1.20",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.13",
    "email-validator>=2.3",
    "argon2-cffi>=25.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.30",
    "pypdf>=7.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.seed" = ["documents/*.md", "documents/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Newer Starlette nags about httpx in the test client; it still works fine.
    "ignore:Using `httpx` with `starlette.testclient`",
]
