[project]
name = "annotate-api"
version = "0.1.0"
description = "API for annotate: highlight and take notes on your reading."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.38",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.11",
    "email-validator>=2.3",
    "argon2-cffi>=25.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "pypdf>=6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.14",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.seed" = ["documents/*.md", "documents/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
