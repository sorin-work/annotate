<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Highlight, annotate and search everything you read." />
    <title>annotate</title>
    <script>
      // Pick the theme before the first paint so dark mode doesn't flash white.
      // src/lib/theme.ts takes over once the app has loaded.
      try {
        const saved = localStorage.getItem('annotate.theme');
        const dark = saved
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {
        // Private mode without storage: the app sets the theme on load.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
